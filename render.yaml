# Render Blueprint: deploys the API and the website together.
# On render.com: New → Blueprint → pick this repo. Then fill in the
# values marked "sync: false" in the Render dashboard.
services:
  - type: web
    name: spendwise-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false # your hosted MySQL URL: mysql+pymysql://user:pass@host:port/dbname
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        value: ca.pem # commit Aiven's CA certificate as backend/ca.pem
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false # e.g. https://spendwise-web.onrender.com

  - type: web
    name: spendwise-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://spendwise-api.onrender.com
